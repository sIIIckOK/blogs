    <script>
        const $ = (selector) => document.querySelector(selector)
        const $$ = (selector) => document.querySelectorAll(selector)

        let viewport_layer = $(".viewport-layer")

        viewport_arr = []

        let viewport_close_btn = $(".viewport-close-btn")
        let viewport_btns = $$(".viewport-btn")

        function open_viewport(e) {
            let id = parseInt(e.srcElement.id, 10)
            let element = viewport_arr[id]
            viewport_layer.innerHTML = element
            viewport_layer.classList.toggle('invisible')
            viewport_close_btn.classList.toggle('invisible')
        }

        function close_viewport(e) {
            viewport_layer.innerHTML = ''
            viewport_layer.classList.toggle('invisible')
            viewport_close_btn.classList.toggle('invisible')
        }

        for (let i = 0; i < viewport_btns.length; i++) {
            viewport_btns[i].addEventListener("click", open_viewport)
        }

        viewport_close_btn.addEventListener("click", close_viewport);

        let anchors = $$(".anchor")
        let currentAnchor = 0

        function goToAnchor(anchors, index) {
            if (index < 0 || index >= anchors.length) return;

            anchors[index].scrollIntoView({
                behavior: "smooth"
            });
        }

        document.addEventListener("keydown", (event) => {
            if (!document.body.classList.contains("presentation")) return;

            if (event.key === "ArrowRight" || event.key === "ArrowDown") {
                if (currentAnchor + 1 < anchors.length) currentAnchor += 1;
            }

            if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
                if (currentAnchor - 1 >= 0) currentAnchor -= 1;
            }
            goToAnchor(anchors, currentAnchor)
        });

        $(".present-mode-btn").onclick = toggle_present;

        function toggle_present() {
            document.body.classList.toggle("presentation");
            goToAnchor(anchors, 0)
        }

    </script>
